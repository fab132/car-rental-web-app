<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}CityCar{% endblock %} — CityCar Rental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<header class="cc-bar">
  <div class="inner">
    <a class="cc-logo" href="/"><span class="mark">CC</span>CityCar</a>
    <nav class="cc-tabs" aria-label="Main">
      <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>Home</a>
      <a href="/new-rental" {% if active == 'new-rental' %}aria-current="page"{% endif %}>New rental</a>
      <a href="/overview" {% if active == 'overview' %}aria-current="page"{% endif %}>Overview</a>
      <a href="/queue" {% if active == 'queue' %}aria-current="page"{% endif %}>Yard queue</a>
    </nav>
  </div>
</header>
<main class="cc-main">
  {% block content %}{% endblock %}
</main>
</body>
</html>
